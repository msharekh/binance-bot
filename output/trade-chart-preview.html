<div id="trade-preview" aria-label="Open trade chart design preview">
<style>
#trade-preview{background:#0f172a;color:#f8fafc;font:14px system-ui,sans-serif;padding:20px;border:1px solid #334155;border-radius:12px}
#trade-preview .heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
#trade-preview h3{margin:0;font-size:18px}#trade-preview .muted{color:#94a3b8;font-size:12px;margin:5px 0}
#trade-preview .controls{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}#trade-preview label{display:flex;gap:7px;align-items:center;cursor:pointer}
#trade-preview input{accent-color:#34d399}#trade-preview svg{display:block;width:100%;background:#0b1220;border-radius:6px}
#trade-preview .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#94a3b8}
</style>
<div class="heading"><div><h3>AAVEUSDT · Open trade</h3><div class="muted">Design preview · Illustrative prices · 5m candles</div></div><strong id="preview-pnl" style="color:#34d399"></strong></div>
<div class="controls"><label><input id="preview-details" type="checkbox">Show details</label><label><input id="preview-loss" type="checkbox">Preview negative net</label></div>
<svg id="preview-chart" role="img" aria-label="Trade price chart with emphasized current price and estimated net profit"></svg>
<div class="legend"><span style="color:#22d3ee">━ EMA 9</span><span style="color:#facc15">━ EMA 21</span><span>Green fill: EMA 9 above EMA 21</span></div>
<script>
(()=>{
 const root=document.getElementById('trade-preview'), svg=root.querySelector('#preview-chart');
 const details=root.querySelector('#preview-details'), loss=root.querySelector('#preview-loss');
 const style={nowWidth:2.8,netBackground:true};
 const closes=[94.65,94.58,94.7,94.83,94.74,94.94,95.02,94.91,95.15,95.26,95.13,95.3,95.38,95.25,95.46,95.6,95.42,95.58,95.65,95.52,95.7,95.62,95.68,95.6];
 const ema=span=>{let value=closes[0];return closes.map(c=>(value+=(c-value)*2/(span+1)))};
 const fast=ema(9),slow=ema(21);
 function render(){
  const w=Math.max(280,svg.getBoundingClientRect().width),h=390,narrow=w<500,left=8,right=w-(narrow?104:156),top=34,bottom=348;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const y=p=>top+(96.4-p)/2.7*(bottom-top),x=i=>left+(right-left)*(i+.5)/closes.length;
  const current=loss.checked?94.88:95.6,net=p=>.6*(p-94.8)-.6*(94.8+p)*.001,fmt=p=>(net(p)>0?'+':'')+net(p).toFixed(2);
  const color=net(current)>0?'#34d399':'#fb7185';
  root.querySelector('#preview-pnl').textContent=`Est. net ${fmt(current)} USDT`;
  root.querySelector('#preview-pnl').style.color=color;
  let out='<title>Illustrative open trade with clean and detailed views</title>';
  for(let i=0;i<4;i++){const yy=top+i*(bottom-top)/3;out+=`<line x1="${left}" x2="${right}" y1="${yy}" y2="${yy}" stroke="#1e293b"/>`}
  closes.forEach((c,i)=>{const o=i?closes[i-1]:94.7,xx=x(i),cc=c>=o?'#34d399':'#fb7185';out+=`<line x1="${xx}" x2="${xx}" y1="${y(Math.max(o,c)+.1)}" y2="${y(Math.min(o,c)-.09)}" stroke="${cc}" opacity=".55"/><rect x="${xx-3}" y="${y(Math.max(o,c))}" width="6" height="${Math.max(2,Math.abs(y(o)-y(c)))}" fill="${cc}" opacity=".55"/>`});
  const path=v=>v.map((p,i)=>`${x(i)},${y(p)}`).join(' ');
  for(let i=0;i<fast.length-1;i++){
   const a=fast[i]-slow[i],b=fast[i+1]-slow[i+1],cuts=a*b<0?[0,a/(a-b),1]:[0,1];
   for(let j=0;j<cuts.length-1;j++){
    const s=cuts[j],e=cuts[j+1],green=a+(b-a)*(s+e)/2>0;
    const point=(v,t)=>`${x(i)+(x(i+1)-x(i))*t},${y(v[i]+(v[i+1]-v[i])*t)}`;
    out+=`<polygon points="${point(fast,s)} ${point(fast,e)} ${point(slow,e)} ${point(slow,s)}" fill="${green?'#22c55e':'#ef4444'}" opacity="${green?.38:.12}"/>`;
   }
  }
  [fast,slow].forEach((v,i)=>out+=`<polyline points="${path(v)}" fill="none" stroke="${i?'#facc15':'#22d3ee'}" stroke-width="1.6"/>`);
  const levels=[{name:'TP',p:96.1,c:'#6ee7b7',net:true,sub:'Original TP',width:1.7},{name:'Now',p:current,c:color,net:true,width:style.nowWidth},{name:'SL',p:94.05,c:'#fda4af',net:true,width:1.7}];
  if(details.checked)levels.push({name:'Min profit',p:(94.8*.6*1.001+.5)/(.6*.999),c:'#fbbf24',net:true,width:1},{name:'BE',p:94.8*1.001/.999,c:'#cbd5e1',width:1},{name:'Entry',p:94.8,c:'#94a3b8',width:1});
  let lastY=-100;
  levels.sort((a,b)=>b.p-a.p).forEach(l=>{
   const yy=y(l.p),labelY=Math.max(yy,lastY+34);lastY=labelY;
   const primary=['TP','SL','Now'].includes(l.name),font=narrow?11:12;
   out+=`<line x1="${left}" x2="${right}" y1="${yy}" y2="${yy}" stroke="${l.c}" stroke-width="${l.width}" opacity="${primary?.95:.38}" ${l.name==='Now'?'':'stroke-dasharray="5 5"'}/><path d="M ${right} ${yy} L ${right+5} ${labelY}" fill="none" stroke="${l.c}" opacity=".6"/>`;
   out+=`<text x="${right+8}" y="${labelY+4}" fill="${l.c}" font-size="${font}" font-weight="${primary?700:500}">${l.name} ${l.p.toFixed(2)}</text>`;
   if(l.sub)out+=`<text x="${right+8}" y="${labelY+18}" fill="#c4b5fd" font-size="11">= ${l.sub}</text>`;
   if(l.net){if(style.netBackground)out+=`<rect x="${left}" y="${labelY-11}" width="${narrow?128:143}" height="23" rx="4" fill="#0b1220"/>`;out+=`<text x="${left+5}" y="${labelY+4}" fill="${l.c}" font-size="${font}" font-weight="700">Est. net ${fmt(l.p)} USDT</text>`}
  });
  out+=`<text x="${left}" y="380" fill="#94a3b8" font-size="11">12:00</text><text x="${right}" y="380" text-anchor="end" fill="#94a3b8" font-size="11">13:55</text><text x="${right+8}" y="20" fill="#94a3b8" font-size="11">Price · USDT</text>`;
  svg.innerHTML=out;
 }
 details.addEventListener('change',render);loss.addEventListener('change',render);
 new ResizeObserver(render).observe(svg);render();
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSlider(style,'nowWidth',{label:'Now line weight',min:1,max:4,step:.2,unit:'px'});t.addToggle(style,'netBackground',{label:'Net label backgrounds'});}
})();
</script>
</div>
